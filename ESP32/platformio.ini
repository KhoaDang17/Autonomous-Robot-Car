; PlatformIO Project Configuration File for DFRobot FireBeetle 2 ESP32-C6
;
; Role: Main Brain (High-Level Controller)
; Reads 3 front trapezoid HC-SR04 ultrasonic sensors and the top-mounted
; Slamtec RPLIDAR C1 (460800 bps), executes multisensor collision avoidance,
; and sends Mecanum velocity commands over UART (115200 bps) to Arduino Uno.

[env:firebeetle2_esp32c6]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino

; Route USB-C CDC port to Serial for PC debugging on FireBeetle 2 ESP32-C6
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; PC Serial Monitor baud rate
monitor_speed = 115200
