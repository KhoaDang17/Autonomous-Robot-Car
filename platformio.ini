; PlatformIO Unified Multi-MCU Configuration
; Autonomous Robot Car: Object Detection & Collision Avoidance
;
; Uses build_src_filter and lib_ignore to compile either firmware target from one root:
;   - env:firebeetle2_esp32c6 : High-level Main Brain (src/ESP32_Brain/)
;   - env:uno                 : Low-level Motor Slave (src/Arduino_Driver/)

[platformio]
default_envs = firebeetle2_esp32c6, uno

[env]
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+
build_flags =
    -Iinclude

; ----------------------------------------------------------------------------
; Target 1: DFRobot FireBeetle 2 ESP32-C6 (Main Brain)
; Reads 3 front trapezoid HC-SR04 sensors & Slamtec RPLIDAR C1 (460800 bps),
; executes multisensor collision avoidance, and transmits UART velocity packets.
; ----------------------------------------------------------------------------
[env:firebeetle2_esp32c6]
platform = espressif32
board = esp32-c6-devkitc-1
build_src_filter =
    -<*>
    +<ESP32_Brain/>
lib_ignore =
    MotorDriver
    SerialComm
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ----------------------------------------------------------------------------
; Target 2: Arduino Uno / Keyestudio KS0560 (Low-Level Motor Controller Slave)
; Receives UART velocity commands (115200 bps) from ESP32-C6 and drives
; 4 Mecanum DC motors through the onboard STC8 I2C coprocessor (0x30).
; ----------------------------------------------------------------------------
[env:uno]
platform = atmelavr
board = uno
build_src_filter =
    -<*>
    +<Arduino_Driver/>
lib_ignore =
    ArduinoLink
    LidarSensor
    NavigationLogic
    RobotInterface
    UltrasonicSensor
