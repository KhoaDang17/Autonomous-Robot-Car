; PlatformIO Project Configuration File for Arduino Uno (Keyestudio KS0560)
;
; Role: Low-Level Motor Controller Slave
; Receives UART velocity commands from the FireBeetle 2 ESP32-C6 Master
; via Hardware Serial (D0 RX / D1 TX at 115200 bps) and drives the 4 Mecanum
; DC motors through the onboard STC8 I2C coprocessor (address 0x30).

[env:uno]
platform = atmelavr
board = uno
framework = arduino

; Hardware Serial baud rate (must match ESP32 UNO_BAUD)
monitor_speed = 115200
